<script>
const a=document.getElementById('music'),b=document.getElementById('musicBtn');
a.volume=.8;
function s(){b.classList.toggle('playing',!a.paused);b.textContent=a.paused?'▶':'Ⅱ'}
async function playMusic(){
  try{await a.play();s();}catch(e){console.log(e);s();}
}
